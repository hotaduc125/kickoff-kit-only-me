[project]
name = "avflow"
version = "2.6.2"
description = "One-command setup of the team's AI coding workflow: ticket system, repository/CI, Claude Code, Superpowers and team skills."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "keyring>=24",
  "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
avflow = "avflow.cli:main"
avflow-ticket-mcp = "avflow.tickets.server:main"
avflow-git-guard = "avflow.git_guard:main"
avflow-monitor = "avflow.monitor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
