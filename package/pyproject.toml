[project]
name = "kickoff-kit"
version = "1.1.3"
description = "One-command setup of the team's AI coding workflow: ticket system, repository/CI, Claude Code, Superpowers and team skills."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "keyring>=24",
  "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
kickoff-kit = "kickoff_kit.cli:main"
kickoff-ticket-mcp = "kickoff_kit.tickets.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kickoff_kit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
