# avflow team configuration — the PM edits team/avflow-team.toml in the development repository;
# release.py embeds it here. Members never need to answer these questions in setup.
team_version = "dev"
marketplace = ""

[tickets]
provider = "redmine"
url = ""
status_ready = "Ready"
status_in_progress = "In progress"
status_in_review = "In review"
status_ready_for_test = "Ready for test"
field_hotspot = "Hotspot"
field_risk_area = "Risk area"
tracker_bug = "Bug"
blocker_done = ["Ready for test", "Resolved", "Closed"]
mr_url_prefix = ""
project = ""

[repo]
provider = "gitlab"
host = "gitlab.com"

[workflow]
profile = "superpowers"
git_guardrails = true
protected_branches = ["main", "master", "develop", "release/*"]

[models]
plan = "sonnet"
implement = "sonnet"
review = "opus"

[monitor]
enabled = true
warn_tokens = 150000
critical_tokens = 250000
enforce = false

[guards]
one_ticket_per_session = true        # a second start_ticket in the same session is blocked: /clear first
max_read_kb = 200                    # reading a larger file whole is blocked (offset/limit or Grep); 0 = off
