# avflow team configuration — edited by the PM, embedded into every release by scripts/release.py.
# Members only enter their own tokens in `avflow setup`; everything here applies to the whole team.
# Change it, release (`release.py --push`), and members get it with `avflow update`.
# team_version is set by release.py.

[tickets]
provider = "redmine"
url = "https://redmine.enclave.vn/redmine"
# Statuses and fields created by the Redmine admin (recommended):
status_ready = "Ready"
status_in_progress = "In progress"
status_in_review = "In review"
blocker_done = ["Ready for test", "Resolved", "Closed"]
# Without an admin's setup, use Redmine's default statuses instead:
# status_ready = "New"
# status_in_progress = "In Progress"
# status_in_review = "Feedback"
# blocker_done = ["Resolved", "Closed"]
field_mode = "Mode"
field_machine_side = "Machine-side"
field_hotspot = "Hotspot"
tracker_bug = "Bug"
mr_url_prefix = "https://gitlab.enclave.vn/"
project = ""

[repo]
provider = "gitlab"
host = "gitlab.enclave.vn"

[workflow]
profile = "superpowers"            # superpowers | pocock — the team's coding workflow
git_guardrails = true
protected_branches = ["main", "master", "develop", "release/*"]

[models]                             # opus | sonnet | haiku | inherit
plan = "opus"
implement = "sonnet"
review = "opus"

[monitor]                            # tokens
enabled = true
warn_tokens = 300000
critical_tokens = 400000
enforce = false
