# Project pipeline. After running `avflow init`, add at the top:
#   include:
#     - local: .gitlab-ci.avflow.yml
stages: [lint, test]

default:
  image: python:3.12-slim

lint:
  stage: lint
  script:
    - pip install -q ruff
    - ruff check .

test:
  stage: test
  script:
    - pip install -q pytest
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
